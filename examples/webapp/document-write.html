<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>webapp fixture: document.write</title>
<script>
window.writeLog = [];
document.write('<style>#styled{display:block;width:93px}</style>');
document.write('<p id="early">written in head</p>');
</script>
<style>body{font-family:Arial,sans-serif;margin:16px} .m{font:13px monospace;margin:2px 0}</style>
</head>
<body>
<h1 data-m="STATIC document-write">STATIC document-write</h1>
<div id="out"></div>
<script>
function mark(t){var d=document.createElement('div');d.className='m';d.setAttribute('data-m',t);d.textContent=t;document.getElementById('out').appendChild(d);}
function check(name,fn){try{fn();}catch(e){console.log('FIXTURE '+name+' threw: '+e);}}
</script>
<div id="before">before</div>
<script id="writer">
writeLog.push('writer');
document.write('<div id="w1">one</div><div id="w2">');
document.writeln('two</div>');
document.write('<script>writeLog.push("inline:" + document.currentScript.previousElementSibling.id); document.write("<i id=nested>nested</i>")<\/script>');
document.write('<script src="write-ext.js"><\/script><b id="last">last</b>');
writeLog.push('writer-end:' + !!document.getElementById('w1'));
</script>
<div id="after">after</div>
<script>
writeLog.push('after-script');
check('order', function(){
  mark('DW order ' + writeLog.join(' '));
});
check('place', function(){
  var ids = [], n;
  for (n = document.getElementById('before'); n && n.id !== 'after'; n = n.nextElementSibling) if (n.id) ids.push(n.id);
  mark('DW placed ' + ids.join(' '));
});
check('head', function(){
  var early = document.getElementById('early');
  mark('DW head p:' + (early ? early.parentNode.tagName : 'none') + ' text:' + document.getElementById('w2').textContent.replace(/\n/g, '\\n'));
});
</script>
<div id="styled">styled</div>
<script>
check('style', function(){ mark('DW style width:' + Math.round(document.getElementById('styled').getBoundingClientRect().width)); });
</script>
</body>
</html>
