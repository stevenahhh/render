<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>webapp fixture: misc globals</title>
<style>body{font-family:Arial,sans-serif;margin:16px} .m{font:13px monospace;margin:2px 0}</style>
</head>
<body>
<h1 data-m="STATIC misc-globals">STATIC misc-globals</h1>
<div id="out"></div>
<script>
function mark(t){var d=document.createElement('div');d.className='m';d.setAttribute('data-m',t);d.textContent=t;document.getElementById('out').appendChild(d);}
function check(name,fn){try{fn();}catch(e){console.log('FIXTURE '+name+' threw: '+e);}}
function tail(u){return u.slice(u.lastIndexOf('/webapp/'));}
</script>
<script>
check('location', function(){
  mark('MISC location href:'+tail(location.href)+' pathname:'+tail(location.pathname)+' sameAsURL:'+(location.href===document.URL));
});
</script>
<script>
check('pushState', function(){
  var len=history.length;
  history.pushState({a:1}, '', 'pushed-page.html');
  mark('MISC history.pushState pathname:'+tail(location.pathname)+' state:'+history.state.a+' grew:'+(history.length===len+1));
});
</script>
<script>
check('TextEncoder', function(){
  var bytes=new TextEncoder().encode('h\u00e9llo \u20ac');
  var back=new TextDecoder().decode(bytes);
  mark('MISC TextEncoder bytes:'+bytes.length+' uint8:'+(bytes instanceof Uint8Array)+' roundtrip:'+(back==='h\u00e9llo \u20ac'));
});
</script>
<script>
check('base64', function(){
  mark('MISC base64 btoa:'+btoa('hello')+' atob:'+atob('aGVsbG8='));
});
</script>
<script>
check('structuredClone', function(){
  var src={a:[1,{b:2}], d:new Date(0), m:new Map([[1,'x']])};
  src.self=src;
  var c=structuredClone(src);
  mark('MISC structuredClone deep:'+(c.a[1]!==src.a[1] && c.a[1].b===2)+' date:'+(c.d instanceof Date && c.d.getTime()===0)+
    ' map:'+c.m.get(1)+' cycle:'+(c.self===c));
});
</script>
<script>
check('substr', function(){
  mark('MISC substr '+'abcdef'.substr(1, 3)+' '+'abcdef'.substr(-2));
});
</script>
<script>
var hc = 1;
<!-- an HTML-like comment: this line is ignored by JavaScript
hc = 2;
--> a line starting with the closing form is a comment too
mark('MISC html comment in script hc:' + hc);
</script>
<script>
check('recursion', function(){
  function depth(n){ return n === 0 ? 0 : 1 + depth(n - 1); }
  mark('MISC recursion depth:'+depth(1000));
});
</script>
<script>
check('toStringTag', function(){
  var t=function(o){return Object.prototype.toString.call(o).slice(8,-1);};
  mark('MISC toStringTag '+[t(document.querySelectorAll('p')),t(document),t(document.body.classList),t(new Event('x')),t(new XMLHttpRequest()),t([]),t({})].join(' '));
});
</script>
<script>
check('streams', function(){
  var d=new TextDecoder(), euro=new TextEncoder().encode('\u20ac');
  var split=d.decode(euro.subarray(0,1),{stream:true})+d.decode(euro.subarray(1),{stream:true})+d.decode();
  var s=new ReadableStream({start:function(c){c.enqueue('h\u00e9');c.enqueue('llo');c.close();}}).pipeThrough(new TextEncoderStream()).pipeThrough(new TextDecoderStream());
  var r=s.getReader(), out='';
  (function pump(){ r.read().then(function(x){ if(x.done){ mark('MISC streams piped:'+(out==='h\u00e9llo')+' split:'+(split==='\u20ac')); return; } out+=x.value; pump(); }); })();
});
</script>
<script>
check('visualViewport', function(){
  var v=window.visualViewport;
  mark('MISC visualViewport scale:'+v.scale+' width:'+(v.width===innerWidth)+' height:'+(v.height===innerHeight)+' offset:'+v.offsetLeft+','+v.offsetTop+' target:'+(v instanceof EventTarget));
});
</script>
<script>
check('intl-call', function(){
  mark('MISC Intl without new nf:'+Intl.NumberFormat('en-US').format(1234)+' dtf:'+(Intl.DateTimeFormat() instanceof Intl.DateTimeFormat)+' collator:'+typeof Intl.Collator().compare);
});
</script>
<script>
check('idl-accessors', function(){
  var get=function(o,k){var d=Object.getOwnPropertyDescriptor(o,k);return d&&d.get;};
  var nodeType=get(Node.prototype,'nodeType');
  var doc=Object.getOwnPropertyDescriptor(window,'document');
  var xhr=new XMLHttpRequest();
  xhr.responseType='json'; xhr.responseType='bogus';
  var a=document.createElement('p'); a.setAttribute('k','v'); a.innerHTML='<i></i><b></b>';
  mark('MISC idl accessors nodeType:'+nodeType.call(document.body)+'/'+nodeType.call(document.createTextNode('t'))+
    ' navigator:'+(navigator instanceof Navigator&&get(Navigator.prototype,'userAgent').call(navigator)===navigator.userAgent)+
    ' document:'+(doc.get.call(window)===document&&!doc.configurable)+' closed:'+get(window,'closed').call(window)+
    ' performance:'+(performance instanceof Performance&&typeof Performance.prototype.getEntriesByType)+
    ' collection:'+get(HTMLCollection.prototype,'length').call(a.children)+
    ' attr:'+get(Attr.prototype,'ownerElement').call(a.attributes[0]).tagName+
    ' xhr:'+get(XMLHttpRequest.prototype,'readyState').call(xhr)+'/'+xhr.responseType+
    ' request:'+get(Request.prototype,'url').call(new Request('x.json')).endsWith('/x.json'));
});
</script>
<style>.hidden-box{display:none} .gap{--gap:12px} .gap>i{display:block;margin-inline-end:var(--gap);height:7px}</style>
<div class="hidden-box gap"><i id="undisplayed"></i></div>
<script>
check('undisplayed-style', function(){
  var s=getComputedStyle(document.getElementById('undisplayed'));
  mark('MISC undisplayed style display:'+s.display+' margin:'+s.getPropertyValue('margin-inline-end')+' height:'+s.height+' var:'+s.getPropertyValue('--gap').trim());
});
</script>
<svg id="shapes" width="0" height="0"><line x1="0" y1="0" x2="3" y2="4"/><rect width="10" height="20"/><rect width="10" height="20" rx="5"/><circle r="1"/><polygon points="0,0 10,0 10,10"/><path d="M0 0h10v10z"/><path d="m0 0a5 5 0 0 1 10 0"/><path d="M0 0C0 0 10 0 10 0S20 0 20 0"/><path d="M0,0Q5,0 10,0T20,0"/></svg>
<script>
check('getTotalLength', function(){
  var out=[].map.call(document.getElementById('shapes').children, function(e){ return e.getTotalLength().toFixed(2); });
  mark('MISC getTotalLength '+out.join(' '));
});
</script>
<script>
check('wrapped-lazy', function(){
  var saved=Element.prototype.attachShadow, calls=0;
  document.createElement('div').setHTMLUnsafe('<b></b>');
  Element.prototype.attachShadow=function(o){ calls++; return saved.call(this,o); };
  var a=document.createElement('div').attachShadow({mode:'open'}), b=document.createElement('p').attachShadow({mode:'open'});
  mark('MISC wrapped lazy method roots:'+(a instanceof ShadowRoot && b instanceof ShadowRoot)+' calls:'+calls);
  Element.prototype.attachShadow=saved;
});
</script>
</body>
</html>
