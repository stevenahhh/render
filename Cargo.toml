[package]
name = "render"
version = "0.1.0"
edition = "2021"
description = "A small, fast HTML/CSS renderer with a browser-style window"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
resvg = { version = "0.45", default-features = false }
ab_glyph = "0.2"
boa_engine = { version = "0.22.0", features = ["annex-b"] }
memchr = "2"
softbuffer = "0.4"
winit = "0.30"
mimalloc = { version = "0.1.52", default-features = false }
memmap2 = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
flate2 = "1"
# WOFF2 web fonts are Brotli-compressed; a decoder-only, pure-Rust crate.
brotli-decompressor = "6"

# AVIF images are decoded by the system's ImageIO; these bind its CoreGraphics side.
# Animation frames follow the display through a display link.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObjCRuntime", "NSRunLoop", "NSString"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CADisplayLink", "CAFrameRateRange"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFDictionary", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[patch.crates-io]
boa_engine = { git = "https://github.com/stevenahhh/boa", branch = "render-perf" }
boa_parser = { git = "https://github.com/stevenahhh/boa", branch = "render-perf" }
boa_ast = { git = "https://github.com/stevenahhh/boa", branch = "render-perf" }
boa_gc = { git = "https://github.com/stevenahhh/boa", branch = "render-perf" }
boa_interner = { git = "https://github.com/stevenahhh/boa", branch = "render-perf" }
boa_string = { git = "https://github.com/stevenahhh/boa", branch = "render-perf" }
boa_macros = { git = "https://github.com/stevenahhh/boa", branch = "render-perf" }
